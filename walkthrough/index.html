<main class="stage">
  <canvas id="scene" aria-label="Hive Academy hall, interactive 3D view"></canvas>

    <div class="loading__card">
      <p class="loading__eyebrow">Hive Academy</p>
      <h1 class="loading__title">Opening the hall</h1>

  </div>

    <button id="vr" class="vr" type="button" hidden>Enter VR</button>
  </div>
  <div id="joy" class="joy" aria-hidden="true"><div id="joy-knob" class="joy__knob"></div></div>
